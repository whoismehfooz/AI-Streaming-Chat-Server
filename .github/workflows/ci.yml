name: CI

on:
  push:
    branches:
      - main
      - feature/backend-core

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit and API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: streaming_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d streaming_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GROQ_API_KEY: XXYYZZ
      GROQ_MODEL: openai/gpt-oss-20b
      DATABASE_URL: postgres+asyncpg://ci_user:ci_password@localhost:5432/streaming_db
      TEST_DATABASE_URL: postgres+asyncpg://ci_user:ci_password@localhost:5432/streaming_db_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost \
            -U ci_user \
            -d streaming_db \
            -c "CREATE DATABASE streaming_db_test;"

      - name: Run Alembic migrations
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/streaming_db_test
        run: alembic upgrade head

      - name: Run Tests
        run: python -m pytest -m "not integration"

  integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: streaming_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d streaming_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GROQ_API_KEY: XXYYZZ
      GROQ_MODEL: openai/gpt-oss-20b
      DATABASE_URL: postgres+asyncpg://ci_user:ci_password@localhost:5432/streaming_db
      TEST_DATABASE_URL: postgres+asyncpg://ci_user:ci_password@localhost:5432/streaming_db_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/streaming_db
        run: alembic upgrade head

      - name: Run database integration Tests
        run: python -m pytest -q tests/integration/test_chat_flow.py
